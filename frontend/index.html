<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Performance: DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- SEO Optimization -->
    <title>Spresy — AI Lead Scraper & Market Intelligence</title>
    <meta name="description" content="Spresy is an AI-powered lead scraper and market intelligence platform. Find real leads with emails & phone numbers, validate business ideas, and get market insights — all legally scraped from public sources.">
    <meta name="author" content="Spresy">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Spresy — AI Lead Scraper & Market Intelligence" />
    <meta property="og:description" content="Spresy is an AI-powered lead scraper and market intelligence platform. Find real leads with emails & phone numbers, validate business ideas, and get market insights." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://spresy.com" />
    <meta property="og:site_name" content="Spresy" />
    <meta property="og:type" content="website" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spresy — AI Lead Scraper & Market Intelligence" />
    <meta name="twitter:description" content="Spresy is an AI-powered lead scraper and market intelligence platform. Find real leads with emails & phone numbers, validate business ideas, and get market insights." />
    <meta name="twitter:image" content="/og-image.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
